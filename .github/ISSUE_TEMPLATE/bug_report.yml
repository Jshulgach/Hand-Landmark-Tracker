name: Bug report
description: Report a reproducible problem in HandTrack.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please include the command you ran, the backend you selected, and the exact error output.
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: handtracker gui --backend webcam
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - auto
        - webcam
        - optitrack
        - not applicable
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      placeholder: OS, Python version, installation method, camera hardware