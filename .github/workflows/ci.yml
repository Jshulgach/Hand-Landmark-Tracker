name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate (automated release checks always use all)
        type: choice
        default: all
        options: [all, windows-latest, ubuntu-latest, macos-15-intel, macos-15]
      python:
        description: Python version to validate
        type: choice
        default: all
        options: [all, '3.10', '3.11', '3.12']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.platform && inputs.platform != 'all' && fromJSON(format('["{0}"]', inputs.platform)) || fromJSON('["windows-latest", "ubuntu-latest", "macos-15-intel", "macos-15"]') }}
        python: ${{ inputs.python && inputs.python != 'all' && fromJSON(format('["{0}"]', inputs.python)) || fromJSON('["3.10", "3.11", "3.12"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the base wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          python scripts/check_dependencies.py
      - name: Consumer smoke without desktop extras
        shell: bash
        run: |
          cp scripts/consumer_smoke.py "$RUNNER_TEMP/mavis_consumer.py"
          cp docs/source/_static/HandDynamic.mp4 "$RUNNER_TEMP/mavis-positive.mp4"
          cd "$RUNNER_TEMP"
          python mavis_consumer.py --video "$RUNNER_TEMP/mavis-positive.mp4" --diagnostics "$RUNNER_TEMP/mavis-consumer-diagnostics"
      - name: Install test and desktop extras
        run: |
          python -m pip install ".[dev,gui,io,stream]"
          python scripts/check_dependencies.py
      - name: Run the complete software test suite
        run: python -m pytest -q
      - name: Preserve public demo frame on a failed consumer check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-frame-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/mavis-consumer-diagnostics/decoded-first.png
          if-no-files-found: ignore
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[dev,docs,release]"
      - run: python -m ruff check src/mavis_track scripts/consumer_smoke.py scripts/package_examples.py scripts/check_release.py scripts/check_dependencies.py
      - run: python -m mypy src/mavis_track --ignore-missing-imports --follow-imports=skip
      - run: mkdocs build --strict
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check curated example bundles
        run: python scripts/package_examples.py
