name: CI
on:
  push:
    branches: [main, ls-optitrack, 'codex/**']
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel, macos-15]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the base wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          python -m pip check
      - name: Consumer smoke without desktop extras
        shell: bash
        run: |
          cp scripts/consumer_smoke.py "$RUNNER_TEMP/mavis_consumer.py"
          cd "$RUNNER_TEMP"
          python mavis_consumer.py
      - name: Install test and desktop extras
        run: python -m pip install ".[dev,gui,io,stream]"
      - name: Run the complete software test suite
        run: python -m pytest -q
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[dev,docs,release]"
      - run: python -m ruff check src/mavis_track scripts/consumer_smoke.py scripts/package_examples.py
      - run: python -m mypy src/mavis_track --ignore-missing-imports --follow-imports=skip
      - run: mkdocs build --strict
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check curated example bundles
        run: python scripts/package_examples.py
