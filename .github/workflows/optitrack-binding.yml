name: OptiTrack binding compile check
on:
  push:
    branches: [codex/flex3-illumination]
    paths:
      - .github/workflows/optitrack-binding.yml
      - external/build_optitrack.py
      - external/setup_optitrack.py
      - examples/01_basic_tracking/unity_hand_tracking/optitrack_tools/code_base/camera_sdk_pybind.cpp
      - examples/01_basic_tracking/unity_hand_tracking/optitrack_tools/code_base/CMakeLists.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install pybind11==2.13.6 cmake==3.30.5
      - run: python external/setup_optitrack.py --from-history
      - run: python external/build_optitrack.py --restore-sdk --output .cache/optitrack-binding --bundle
      # Compile/import and local packaging verification only. No artifact upload, release or binary export.
