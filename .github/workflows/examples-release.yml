name: Build example downloads
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/package_examples.py
      - uses: actions/upload-artifact@v4
        with:
          name: mavis-example-downloads
          path: dist/mavis-*-examples.zip
      - name: Attach bundles to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/mavis-*-examples.zip --clobber
